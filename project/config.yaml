data:
  dataset_path: public_crisis_dataset.csv
  notebook_path: global-disaster-data-analysis-and-prediction.ipynb

text_classification:
  text_column: text
  target_column: crisis_type
  cv_splits: 5
  random_state: 42
  use_optuna: false
  optuna_trials: 5

forecasting:
  horizon_years: 5

credibility:
  target_bins: [0.35, 0.7]

hyperparameters:
  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.03
    subsample: 0.9
    colsample_bytree: 0.8
  lightgbm:
    n_estimators: 500
    num_leaves: 64
    learning_rate: 0.03
  random_forest:
    n_estimators: 400
    max_depth: 20
  roberta:
    epochs: 4
    batch_size: 16
    lr: 2e-5
    max_len: 256
  lstm:
    layers: 2
    hidden: 128
    dropout: 0.3
    epochs: 50
